<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>
      Building Local-First AI Experiences: Chrome Built-in AI and WebMCP
    </title>

    <link rel="stylesheet" href="../../dist/reveal.css" />
    <link rel="stylesheet" href="../../dist/theme/white.css" id="theme" />
    <link rel="stylesheet" href="./chrome-theme.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../plugin/highlight/monokai.css" />
  </head>

  <body>
    <div class="chrome-color-strip" aria-hidden="true">
      <span class="chrome-color-strip__yellow"></span>
      <span class="chrome-color-strip__red"></span>
      <span class="chrome-color-strip__green"></span>
      <span class="chrome-color-strip__blue"></span>
    </div>

    <div class="lightbox-overlay" id="lightbox">
      <img id="lightbox-content" alt="Preview" />
    </div>

    <div class="reveal">
      <div class="slides">
        <section
          data-markdown="hook.md"
          data-separator="^\n---\n$"
          data-separator-vertical="^\n--\n$"
        ></section>
        <section
          data-markdown="slides.md"
          data-separator="^\n---\n$"
          data-separator-vertical="^\n--\n$"
        ></section>
      </div>
    </div>

    <div class="watermark fixed bottom-6 left-6 flex items-end gap-3">
      <a
        href="https://asadullahkhalid.com"
        target="_blank"
        class="chrome-watermark-link"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path
            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
          ></path>
        </svg>
        <span>asadullahkhalid.com</span>
      </a>
    </div>

    <script src="../../dist/reveal.js"></script>
    <script src="../../plugin/markdown/markdown.js"></script>
    <script src="../../plugin/highlight/highlight.js"></script>
    <script src="../../plugin/notes/notes.js"></script>
    <script src="../../plugin/math/math.js"></script>
    <script src="../../plugin/zoom/zoom.js"></script>
    <script src="../../plugin/search/search.js"></script>
    <script src="./chrome-theme.js"></script>

    <script>
      Reveal.initialize({
        controls: true,
        progress: true,
        history: true,
        center: true,
        hash: true,

        plugins: [
          RevealMarkdown,
          RevealHighlight,
          RevealNotes,
          RevealMath.KaTeX,
          RevealZoom,
          RevealSearch,
        ],
      }).then(function () {
        window.applyChromeSlideTheme(Reveal);
      });

      document.addEventListener('DOMContentLoaded', function () {
        const lightbox = document.getElementById('lightbox');
        const lightboxContent = document.getElementById('lightbox-content');

        document.addEventListener('click', function (event) {
          const target = event.target.closest('[data-preview-image]');
          if (!target) return;

          event.preventDefault();
          const imageSrc = target.getAttribute('data-preview-image');
          if (!imageSrc) return;

          lightboxContent.src = imageSrc;
          lightbox.classList.add('active');
        });

        lightbox.addEventListener('click', function () {
          lightbox.classList.remove('active');
        });

        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') {
            lightbox.classList.remove('active');
          }
        });
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Beyond Vibe Coding: Building Context-Aware Engineering Workflows</title>

    <link rel="stylesheet" href="../../dist/reveal.css" />
    <link rel="stylesheet" href="../../dist/theme/black.css" id="theme" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../plugin/highlight/monokai.css" />
  </head>

  <body>
    <!-- Lightbox overlay -->
    <div class="lightbox-overlay" id="lightbox">
      <img id="lightbox-content" alt="Preview" />
    </div>

    <div class="reveal">
      <div class="slides">
        <section
          data-markdown="hook.md"
          data-separator="^\n---\n$"
          data-separator-vertical="^\n--\n$"
        ></section>
        <section
          data-markdown="../shared/intro-mbio.md"
          data-separator="^\n---\n$"
          data-separator-vertical="^\n--\n$"
        ></section>
        <section
          data-markdown="slides.md"
          data-separator="^\n---\n$"
          data-separator-vertical="^\n--\n$"
        ></section>
      </div>
    </div>

    <!-- Watermark section with social links -->
    <div class="watermark fixed bottom-6 left-6 flex items-end gap-3">
      <div class="flex flex-col gap-1">
        <a
          href="https://asadullahkhalid.com"
          target="_blank"
          class="text-lg font-semibold text-white hover:text-white transition-all duration-300 relative flex items-center gap-2"
          style="text-shadow: 0 0 10px rgba(79, 12, 173, 0.5)"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.7;flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span class="relative z-10">asadullahkhalid.com</span>
          <span
            class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-[#4f0cad] to-[#6b21a8] transform origin-left transition-transform duration-300 hover:scale-x-110"
            style="bottom: -2px"
          ></span>
        </a>
      </div>
    </div>

    <script src="../../dist/reveal.js"></script>
    <script src="../../plugin/markdown/markdown.js"></script>
    <script src="../../plugin/highlight/highlight.js"></script>
    <script src="../../plugin/notes/notes.js"></script>
    <script src="../../plugin/math/math.js"></script>
    <script src="../../plugin/zoom/zoom.js"></script>
    <script src="../../plugin/search/search.js"></script>

    <script>
      Reveal.initialize({
        controls: true,
        progress: true,
        history: true,
        center: true,

        plugins: [
          RevealMarkdown,
          RevealHighlight,
          RevealNotes,
          RevealMath.KaTeX,
          RevealZoom,
          RevealSearch,
        ],
      });

      /* Custom Lightbox Implementation for reveal.js 4.x
       *
       * The native lightbox feature was introduced in reveal.js 5.2.0, but this project
       * is using reveal.js 4.4.0. This custom implementation provides similar functionality
       * by listening for clicks on elements with data-preview-image attributes and displaying
       * the images in a full-screen overlay.
       *
       * To use the native lightbox, upgrade to reveal.js 5.2.0 or higher and remove this code.
       */
      document.addEventListener('DOMContentLoaded', function () {
        const lightbox = document.getElementById('lightbox');
        const lightboxContent = document.getElementById('lightbox-content');

        document.addEventListener('click', function (e) {
          const target = e.target.closest('[data-preview-image]');
          if (target) {
            e.preventDefault();
            const imageSrc = target.getAttribute('data-preview-image');
            if (imageSrc) {
              lightboxContent.src = imageSrc;
              lightbox.classList.add('active');
            }
          }
        });

        lightbox.addEventListener('click', function () {
          lightbox.classList.remove('active');
        });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && lightbox.classList.contains('active')) {
            lightbox.classList.remove('active');
          }
        });
      });
    </script>
  </body>
</html>
